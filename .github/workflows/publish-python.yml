name: Publish Python SDK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/blockquote-agents
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the tested release wheel
        run: |
          mkdir dist
          curl --fail --location --output dist/blockquote_agents-0.1.1-py3-none-any.whl https://github.com/ArneFfm/blockquote-agents/releases/download/v0.1.1/blockquote_agents-0.1.1-py3-none-any.whl
          echo '9dfe5b7c4a12f0c3fac9ac32bc3c33fa5c8a0fd7b2becc4153af04b96a5113d4  dist/blockquote_agents-0.1.1-py3-none-any.whl' | sha256sum --check
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
