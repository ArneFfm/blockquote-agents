name: Publish Python SDK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    environment:
      name: pypi
      url: https://pypi.org/p/blockquote-agents
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test SDK and CLI
        working-directory: packages/sdk-python
        run: python3 -m unittest discover -s tests
      - name: Build the tested package
        working-directory: packages/sdk-python
        run: |
          python3 -m pip install build
          python3 -m build
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: packages/sdk-python/dist/
